name: Smart Seasonal Update

on:
  schedule:
    # 全年常態（淡季）：每週五台灣時間 17:00 (UTC 09:00) 更新，保持 Repo 活躍避免 60 天休眠
    - cron: '0 9 * * 5'
    # 旺季（3~5 月）：週一至週四 17:00 補上，加上週五即為平日每天收盤後更新
    - cron: '0 9 * 3-5 1-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install beautifulsoup4
      - name: Update gifts data
        run: python3 scripts/update_gifts.py
      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain public/data/gifts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/gifts.json
            git commit -m "chore(data): daily gifts update"
            git push
          else
            echo "no changes"
          fi
