name: Daily Update

on:
  schedule:
    - cron: '30 0,10 * * *'   # 台灣時間 08:30 與 18:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install beautifulsoup4
      - name: Update gifts data
        run: python3 scripts/update_gifts.py
      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain public/data/gifts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/gifts.json
            git commit -m "chore(data): daily gifts update"
            git push
          else
            echo "no changes"
          fi
